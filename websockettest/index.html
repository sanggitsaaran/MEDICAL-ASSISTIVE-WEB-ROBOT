<!DOCTYPE html>
<html>
<head>
  <title>Hexapod Web Navigation</title>
  <script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/EaselJS/1.0.2/easeljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/RobotWebTools/ros2djs/build/ros2d.min.js"></script>
</head>
<body>
  <h2>Hexapod Map</h2>
  <div id="map" style="width:800px; height:600px; border: 1px solid black;"></div>

  <script>
    const ROSBRIDGE_SERVER_IP = "192.168.149.1"; // Replace this
    const ros = new ROSLIB.Ros({
      url: `ws://${ROSBRIDGE_SERVER_IP}:9090`
    });

    ros.on('connection', function () {
      console.log('Connected to websocket server.');
    });

    ros.on('error', function (error) {
      console.log('Error connecting to websocket server: ', error);
    });

    ros.on('close', function () {
      console.log('Connection closed.');
    });

    // Map viewer
    const viewer = new ROS2D.Viewer({
      divID: 'map',
      width: 800,
      height: 600
    });

    // Map client
    const gridClient = new ROS2D.OccupancyGridClient({
      ros: ros,
      rootObject: viewer.scene,
      continuous: true
    });

    // Scale viewer to map
    gridClient.on('change', function () {
      viewer.scaleToDimensions(gridClient.currentGrid.width, gridClient.currentGrid.height);
      viewer.shift(gridClient.currentGrid.pose.position.x, gridClient.currentGrid.pose.position.y);
    });

    // Click-to-set-goal
    const goalTopic = new ROSLIB.Topic({
      ros: ros,
      name: '/rospider/move_base_simple/goal',
      messageType: 'geometry_msgs/PoseStamped'
    });

    viewer.scene.addEventListener('stagemousedown', function (event) {
      const coords = gridClient.viewer.scene.globalToRos(event.stageX, event.stageY);
      console.log("Sending goal to:", coords.x, coords.y);

      const goal = new ROSLIB.Message({
        header: {
          frame_id: 'map'
        },
        pose: {
          position: {
            x: coords.x,
            y: coords.y,
            z: 0.0
          },
          orientation: {
            x: 0.0,
            y: 0.0,
            z: 0.0,
            w: 1.0
          }
        }
      });

      goalTopic.publish(goal);
    });
  </script>
</body>
</html>
